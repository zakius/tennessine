[package]
name = "oganesson_sync"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
fxa-client = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
sync15 = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854", features = ["sync-client"] }
sync-guid = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854", features = ["random"] }
viaduct = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
interrupt-support = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
nss = { package = "nss-as", git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
rc_crypto = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
places = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
autofill = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
types = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
tabs = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
logins = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
webext-storage = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }
db-crypto = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }

[patch.crates-io]
# nss_build_common's hook for Firefox's own build; application-services
# replaces it with this no-op crate in its workspace.
mozbuild = { git = "https://github.com/mozilla/application-services", rev = "c20f69b26d0dd17555bf370ece4565c6f5efc854" }

# places' build script runs glean_parser through pip; this writes its output.
[patch."https://github.com/mozilla/glean"]
glean-build = { path = "glean-build" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
