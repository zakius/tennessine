# Releases tennessine when a release-* tag is pushed, or by hand: builds the APK, publishes it to
# the F-Droid repository, then posts a GitHub release with the APK and notes from the commits since
# the previous one. A merge to main releases nothing. The run releases main's tip, which must
# contain the tagged commit. It runs on the project's own build machine (runner label
# "tennessine"), in the main checkout, which has the build tree and the publish settings. Pull
# requests start nothing: a runner on this machine must never run their code.
name: Release
on:
  push:
    tags: ['release-*']
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
# The runner's .env sets MAIN, the main checkout, and BUILDS_LOCK, which allows one browser build
# at a time on the machine, whichever repo's release starts it.
jobs:
  release:
    runs-on: [self-hosted, tennessine]
    timeout-minutes: 1440
    steps:
      - name: Main checkout at main's tip
        run: |
          : "${MAIN:?must be set in the .env of the runner}" "${BUILDS_LOCK:?must be set in the .env of the runner}"
          cd "$MAIN"
          git fetch -q origin main --tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; tag a commit of main"
            exit 1
          fi
          git merge -q --ff-only origin/main
          git submodule update --init -q
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # A build killed with its runner (a restart of the runner service) leaves its stopped
      # container, whose name then stops every later build. Under the lock no other build runs,
      # so a container of that name is such a leftover.
      - name: Build
        run: cd "$MAIN" && flock "$BUILDS_LOCK" sh -c 'podman rm -f --ignore tennessine-build && ./tennessine.py build --release'
      - name: Publish to the F-Droid repository
        run: cd "$MAIN" && ./tennessine.py publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$MAIN"
          apk="$(ls work/build/tennessine/chromium/src/out/release/*-arm64-v8a.apk)"
          version="$(basename "$apk" -arm64-v8a.apk)"
          # fdroid update names the published APK <package>_<versionCode>.apk.
          published="$(ls -t ~/.local/share/tennessine-fdroid/repo/*.apk | head -1)"
          code="${published##*_}"; code="${code%.apk}"
          tag="v$version-$code"
          asset="$(mktemp -d)/tennessine-$version-$code-arm64.apk"
          cp "$apk" "$asset"
          notes="$(mktemp)"
          dubna/tools/release_notes.py . --skip docs/ '*.md' .github/ > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$RELEASE_SHA" --title "tennessine $version ($code)" --notes-file "$notes"
          fi
