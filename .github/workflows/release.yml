# Releases tennessine when a push to main changes the browser, or by hand: builds the APK,
# publishes it to the F-Droid repository, then posts a GitHub release with the APK and notes from
# the commits since the previous one. It runs on the project's own build machine (runner label
# "tennessine"), in the main checkout, which has the build tree and the publish settings. Pull
# requests start nothing: a runner on this machine must never run their code.
name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/**']
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
env:
  MAIN: /home/zakius/dev/tennessine
  # One browser build at a time on the machine, whichever repo's release starts it.
  BUILDS_LOCK: /home/zakius/dev/.builds.lock
jobs:
  release:
    runs-on: [self-hosted, tennessine]
    timeout-minutes: 1440
    steps:
      - name: Main checkout at this commit
        run: |
          cd "$MAIN"
          git fetch -q origin --tags
          git merge -q --ff-only "$GITHUB_SHA"
          git submodule update --init -q
      - name: Build
        run: cd "$MAIN" && flock "$BUILDS_LOCK" ./tennessine.py build
      - name: Publish to the F-Droid repository
        run: cd "$MAIN" && ./tennessine.py publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$MAIN"
          apk="$(ls work/build/tennessine/chromium/src/out/release/*-arm64-v8a.apk)"
          version="$(basename "$apk" -arm64-v8a.apk)"
          # fdroid update names the published APK <package>_<versionCode>.apk.
          published="$(ls -t ~/.local/share/tennessine-fdroid/repo/*.apk | head -1)"
          code="${published##*_}"; code="${code%.apk}"
          tag="v$version-$code"
          asset="$(mktemp -d)/tennessine-$version-$code-arm64.apk"
          cp "$apk" "$asset"
          notes="$(mktemp)"
          dubna/tools/release_notes.py . --skip docs/ '*.md' .github/ > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "tennessine $version ($code)" --notes-file "$notes"
          fi
